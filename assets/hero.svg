<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 420" width="1280" height="420" role="img" aria-label="VPS and GPU Price Index — open, source-cited pricing data for Hetzner, Vultr and Linode">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="55%" stop-color="#111a2b"/>
      <stop offset="100%" stop-color="#0b1220"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#58a6ff"/>
      <stop offset="100%" stop-color="#3fb950"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0v32" fill="none" stroke="#8b949e" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <clipPath id="card"><rect x="712" y="86" width="512" height="252" rx="12"/></clipPath>
  </defs>

  <rect width="1280" height="420" fill="url(#bg)"/>
  <rect width="1280" height="420" fill="url(#grid)"/>
  <rect x="0" y="0" width="1280" height="4" fill="url(#accent)"/>

  <!-- ── left column ─────────────────────────────────────────────── -->
  <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">
    <text x="64" y="112" fill="#58a6ff" font-size="15" letter-spacing="3.5">OPEN DATA · CC0</text>
  </g>

  <g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">
    <text x="64" y="182" fill="#e6edf3" font-size="58" font-weight="800" letter-spacing="-1.2">VPS &amp; GPU</text>
    <text x="64" y="248" fill="#e6edf3" font-size="58" font-weight="800" letter-spacing="-1.2">Price Index</text>

    <text x="64" y="296" fill="#8b949e" font-size="19">Machine-readable server pricing —</text>
    <text x="64" y="322" fill="#8b949e" font-size="19">every row cites its source and check date.</text>

    <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14">
      <rect x="64"  y="348" width="118" height="30" rx="15" fill="#58a6ff" fill-opacity="0.12" stroke="#58a6ff" stroke-opacity="0.35"/>
      <text x="123" y="368" fill="#79c0ff" text-anchor="middle">prices.json</text>

      <rect x="192" y="348" width="112" height="30" rx="15" fill="#3fb950" fill-opacity="0.12" stroke="#3fb950" stroke-opacity="0.35"/>
      <text x="248" y="368" fill="#56d364" text-anchor="middle">prices.csv</text>

      <rect x="314" y="348" width="152" height="30" rx="15" fill="#d29922" fill-opacity="0.12" stroke="#d29922" stroke-opacity="0.35"/>
      <text x="390" y="368" fill="#e3b341" text-anchor="middle">no API keys</text>
    </g>
  </g>

  <!-- ── right: source-cited rows ────────────────────────────────── -->
  <g clip-path="url(#card)">
    <rect x="712" y="86" width="512" height="252" fill="#0b1220" fill-opacity="0.72"/>
    <rect x="712" y="86" width="512" height="38" fill="#8b949e" fill-opacity="0.07"/>
  </g>
  <rect x="712" y="86" width="512" height="252" rx="12" fill="none" stroke="#30363d"/>

  <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" fill="#8b949e">
    <text x="736" y="110">provider</text>
    <text x="872" y="110">plan</text>
    <text x="1000" y="110">price</text>
    <text x="1118" y="110">source</text>
  </g>

  <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14">
    <!-- hetzner -->
    <text x="736"  y="158" fill="#e6edf3">hetzner</text>
    <text x="872"  y="158" fill="#79c0ff">CX23</text>
    <text x="1000" y="158" fill="#e6edf3">5.49 EUR</text>
    <text x="1118" y="158" fill="#56d364" font-size="12.5">✓ cited</text>
    <rect x="736" y="168" width="180" height="3" rx="1.5" fill="#58a6ff" fill-opacity="0.55"/>

    <!-- linode -->
    <text x="736"  y="212" fill="#e6edf3">linode</text>
    <text x="872"  y="212" fill="#79c0ff">g6-nanode-1</text>
    <text x="1000" y="212" fill="#e6edf3">5.00 USD</text>
    <text x="1118" y="212" fill="#56d364" font-size="12.5">✓ api</text>
    <rect x="736" y="222" width="164" height="3" rx="1.5" fill="#58a6ff" fill-opacity="0.4"/>

    <!-- vultr -->
    <text x="736"  y="266" fill="#e6edf3">vultr</text>
    <text x="872"  y="266" fill="#79c0ff">vc2-1c-1gb</text>
    <text x="1000" y="266" fill="#e6edf3">5.00 USD</text>
    <text x="1118" y="266" fill="#56d364" font-size="12.5">✓ api</text>
    <rect x="736" y="276" width="164" height="3" rx="1.5" fill="#58a6ff" fill-opacity="0.4"/>
  </g>

  <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" fill="#6e7681">
    <text x="736" y="316">currencies not converted · all prices exclude VAT</text>
  </g>
</svg>
